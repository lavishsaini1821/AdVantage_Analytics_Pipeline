# AdVantage Analytics Pipeline - GitHub Actions CI
# Runs on every push to main branch
# Steps: generate data -> run PySpark ETL -> run tests

name: AdVantage CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Generate Data ──────────────────────────────────────────────────
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate mock data
        run: python generate_mock_data.py

      - name: Upload generated CSVs
        uses: actions/upload-artifact@v4
        with:
          name: mock-csv
          path: data/mock_csv/

  # ── Job 2: Run PySpark ETL ────────────────────────────────────────────────
  etl:
    runs-on: ubuntu-latest
    needs: generate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download CSVs
        uses: actions/download-artifact@v4
        with:
          name: mock-csv
          path: data/mock_csv/

      # Install Java (required for PySpark)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Run PySpark ETL
        run: python spark_etl.py

      - name: Upload Parquet output
        uses: actions/upload-artifact@v4
        with:
          name: parquet-output
          path: data/parquet/

  # ── Job 3: Run Tests ─────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: etl
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download Parquet
        uses: actions/download-artifact@v4
        with:
          name: parquet-output
          path: data/parquet/

      - name: Run tests
        run: python -m pytest tests/ -v
